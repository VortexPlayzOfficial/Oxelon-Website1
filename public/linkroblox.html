<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Link your Roblox account to Oxelon securely."
    >

    <meta name="theme-color" content="#050506">

    <title>Link Roblox | Oxelon</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background: #050506;

            color: #f5f5f5;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            position: relative;

            padding: 42px 35px;

            border:
                1px solid
                rgba(255,255,255,.075);

            border-radius: 14px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,.06),
                    transparent 55%
                ),
                rgba(255,255,255,.018);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,.5);

            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 24px;

            border-radius: 17px;

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.09);

            background: #101012;

            box-shadow:
                0 20px 70px
                rgba(0,0,0,.5);
        }

        .logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .eyebrow {
            display: block;

            margin-bottom: 12px;

            color: #55555a;

            font-size: 7px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        h1 {
            font-size: 34px;

            line-height: 1;

            letter-spacing: -1.7px;

            margin-bottom: 14px;
        }

        h1 span {
            color: #77777c;
        }

        .subtitle {
            max-width: 420px;

            margin: auto;

            color: #66666b;

            font-size: 10px;

            line-height: 1.8;
        }

        .status {
            margin-top: 28px;

            padding: 16px;

            border:
                1px solid
                rgba(255,255,255,.06);

            border-radius: 9px;

            background:
                rgba(255,255,255,.018);

            color: #858589;

            font-size: 10px;

            line-height: 1.7;
        }

        .button {
            width: 100%;

            margin-top: 20px;

            padding: 13px 18px;

            border: 0;

            border-radius: 8px;

            background: #f1f1f1;

            color: #080808;

            font-size: 10px;

            font-weight: 750;

            cursor: pointer;

            transition:
                .2s ease;
        }

        .button:hover {
            background: #ffffff;

            transform:
                translateY(-2px);
        }

        .button:disabled {
            opacity: .45;

            cursor: not-allowed;

            transform: none;
        }

        .success {
            color: #62d98b;
        }

        .error {
            color: #ff7474;
        }

        .roblox-card {
            display: none;

            margin-top: 20px;

            padding: 20px;

            border:
                1px solid
                rgba(255,255,255,.06);

            border-radius: 10px;

            background:
                rgba(255,255,255,.018);
        }

        .roblox-avatar {
            width: 55px;
            height: 55px;

            margin: 0 auto 12px;

            border-radius: 50%;

            object-fit: cover;

            background: #171719;
        }

        .roblox-name {
            font-size: 14px;

            font-weight: 750;
        }

        .roblox-id {
            margin-top: 5px;

            color: #55555a;

            font-size: 8px;
        }

        .small {
            margin-top: 24px;

            color: #454549;

            font-size: 8px;

            line-height: 1.7;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .card {
                padding: 35px 23px;
            }

            h1 {
                font-size: 29px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <span class="eyebrow">
            OXELON ACCOUNT LINKING
        </span>

        <div class="logo">
            <img
                src="images/oxelon.png"
                alt="Oxelon Logo"
            >
        </div>

        <h1>
            Link your
            <span>Roblox account.</span>
        </h1>

        <p class="subtitle">
            Connect your Roblox account to Oxelon
            using Roblox's secure authorization system.
        </p>

        <div
            id="status"
            class="status"
        >
            Checking your Oxelon account...
        </div>

        <div
            id="robloxCard"
            class="roblox-card"
        >

            <img
                id="robloxAvatar"
                class="roblox-avatar"
                alt="Roblox avatar"
            >

            <div
                id="robloxName"
                class="roblox-name"
            >
                Roblox Account
            </div>

            <div
                id="robloxId"
                class="roblox-id"
            >
            </div>

        </div>

        <button
            id="linkButton"
            class="button"
            onclick="linkRoblox()"
            style="display:none;"
        >
            Connect Roblox Account
        </button>

        <p class="small">
            Oxelon will never ask for your Roblox
            password or security credentials.
        </p>

    </div>

</div>

<script>

const statusElement =
    document.getElementById("status");

const linkButton =
    document.getElementById("linkButton");

const robloxCard =
    document.getElementById("robloxCard");

const robloxAvatar =
    document.getElementById("robloxAvatar");

const robloxName =
    document.getElementById("robloxName");

const robloxId =
    document.getElementById("robloxId");

async function checkStatus() {

    try {

        const response =
            await fetch(
                "/api/roblox/status",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );

        const text =
            await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(
                "Oxelon returned an invalid response."
            );
        }

        if (!response.ok) {

            statusElement.innerHTML =
                `<span class="error">
                    ${escapeHtml(
                        data.error ||
                        "Please log into Oxelon first."
                    )}
                </span>`;

            return;
        }

        if (data.linked) {

            statusElement.innerHTML =
                `<span class="success">
                    ✓ Roblox account linked successfully.
                </span>`;

            robloxName.textContent =
                data.robloxUsername ||
                data.robloxDisplayName ||
                "Roblox Account";

            robloxId.textContent =
                `User ID: ${data.robloxId}`;

            if (data.robloxAvatar) {

                robloxAvatar.src =
                    data.robloxAvatar;

                robloxAvatar.style.display =
                    "block";

            } else {

                robloxAvatar.style.display =
                    "none";
            }

            robloxCard.style.display =
                "block";

            linkButton.style.display =
                "none";

            return;
        }

        statusElement.textContent =
            "Your Oxelon account is ready to be linked.";

        linkButton.style.display =
            "block";

    } catch (error) {

        console.error(error);

        statusElement.innerHTML =
            `<span class="error">
                ${escapeHtml(
                    error.message ||
                    "Unable to contact Oxelon."
                )}
            </span>`;

    }
}

function linkRoblox() {

    linkButton.disabled = true;

    linkButton.textContent =
        "Connecting...";

    window.location.href =
        "/api/roblox/start";
}

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

const params =
    new URLSearchParams(
        window.location.search
    );

if (
    params.get("linked") === "true"
) {

    statusElement.innerHTML =
        `<span class="success">
            ✓ Roblox account linked successfully.
        </span>`;

    window.history.replaceState(
        {},
        document.title,
        "/linkroblox.html"
    );
}

checkStatus();

</script>

</body>
</html>
