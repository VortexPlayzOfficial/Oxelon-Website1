<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Oxelon — Servers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" aria-label="Oxelon home">
        <span class="brand-mark">O</span>
      </button>

      <nav class="top-actions" aria-label="Dashboard navigation">
        <button class="icon-btn" aria-label="Servers">◉</button>
        <button class="icon-btn" aria-label="Notifications">♧</button>
        <button class="icon-btn" aria-label="Appearance">☼</button>
        <button class="icon-btn" aria-label="Dark mode">☾</button>
      </nav>
    </header>

    <main class="server-page">
      <section class="hero">
        <p class="eyebrow">SERVERS</p>
        <h1>Select the server you want<br class="desktop-break"> to manage</h1>

        <div id="loading" class="loading-state">
          <div class="dots" aria-label="Loading">
            <span></span><span></span><span></span>
          </div>

          <div class="loading-button">
            <span class="spinner"></span>
            <span>GRABBING SERVERS</span>
          </div>
        </div>

        <div id="servers" class="servers-grid" hidden></div>

        <div id="empty" class="empty-state" hidden>
          <div class="empty-icon">◎</div>
          <h2>No servers found</h2>
          <p>Make sure Oxelon is installed in at least one Discord server.</p>
          <button class="retry-btn" id="retry">Try again</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
